<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>刀剣乱舞　特務認証票</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 引入日系明體字型 -->
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Shippori Mincho', serif, "Microsoft JhengHei";
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { color: #1b365d; margin-bottom: 20px; }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      max-width: 1100px;
      justify-content: center;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .form-panel {
      flex: 1;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label { font-size: 14px; font-weight: bold; color: #333; }
    input[type="text"], input[type="file"] {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .preview-panel {
      flex: 1.5;
      min-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    .download-btn {
      margin-top: 15px;
      padding: 12px 24px;
      background-color: #1b365d;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .download-btn:hover { background-color: #2b4f85; }
  </style>
</head>
<body>

  <h1>刀剣乱舞　特務認証票</h1>

  <div class="container">
    <!-- 輸入表單區 -->
    <div class="form-panel">
      <div class="form-group">
        <label>上傳照片：</label>
        <input type="file" id="avatarInput" accept="image/*">
      </div>
      <div class="form-group">
        <label>審神者名：</label>
        <input type="text" id="name" value="">
      </div>
      <div class="form-group">
        <label>本拠地：</label>
        <input type="text" id="base" value="">
      </div>
      <div class="form-group">
        <label>本丸代號：</label>
        <input type="text" id="code" value="">
      </div>
      <div class="form-group">
        <label>近侍：</label>
        <input type="text" id="starter" value="">
      </div>
      <div class="form-group">
        <label>有效期限：</label>
        <input type="text" id="validDate" value="任期満了まで">
      </div>
      <div class="form-group">
        <label>發行編號：</label>
        <input type="text" id="issueNo" value="">
      </div>
      <div class="form-group">
        <label>認可年份：</label>
        <input type="text" id="approveYear" value="">
      </div>
      <div class="form-group">
      <label>顏色 ：</label>
      <select id="bgSelector">
        <option value="template_default.png">預設</option>
        <option value="template_red.png">紅</option>
        <option value="template_yellow.png">黃</option>
        <option value="template_green.png">綠</option>
        <option value="template_blue.png">藍</option>
        <option value="template_white.png">白</option>
        <option value="template_black.png">黑</option>
      </select>
      </div>
      <button class="download-btn" id="downloadBtn">下載</button>
    </div>

    <!-- 畫布預覽區 -->
    <div class="preview-panel">
      <canvas id="cardCanvas" width="1000" height="600"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');

    // 載入底圖
    const bgImg = new Image();
    const bgSelector = document.getElementById('bgSelector');

    // 初始載入選單預設的第一張底圖
    bgImg.src = bgSelector.value;

    let userAvatar = null;

    function renderCard() {
      // 1. 繪製挖空好的底圖
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (bgImg.complete && bgImg.naturalWidth !== 0) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
      } else {
        // 如果圖片還沒載入完，先填灰色底方便除錯
        ctx.fillStyle = "#EAEAEA";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 2. 繪製使用者頭像（預設位置在右方）
      // [X座標, Y座標, 寬度, 高度] -> 根據你的底圖留白位置微調數字
      const photoX = 618, photoY = 178, photoW = 260, photoH = 345;
      if (userAvatar) {
        ctx.drawImage(userAvatar, photoX, photoY, photoW, photoH);
      } else {
        ctx.strokeStyle = "#ccc";
        ctx.lineWidth = 2;
        ctx.strokeRect(photoX, photoY, photoW, photoH);
      }

      // 3. 繪製文字
      ctx.fillStyle = "#111111";
      ctx.font = "700 28px 'Shippori Mincho', serif";

      // 欄位標籤與數值
      const startX = 115;
      const valX = 280;

      ctx.fillText("審神者名", startX, 220);
      ctx.fillText(document.getElementById('name').value, valX, 220);

      ctx.fillText("本　　拠", startX, 275);
      ctx.fillText(document.getElementById('base').value, valX, 275);

      ctx.fillText("本丸代号", startX, 330);
      ctx.fillText(document.getElementById('code').value, valX, 330);

      ctx.fillText("近　　侍", startX, 385);
      ctx.fillText(document.getElementById('starter').value, valX, 385);

      ctx.fillText("有効期限", startX, 440);
      ctx.fillText(document.getElementById('validDate').value, valX, 440);

      // 下方小字
      ctx.font = "700 24px 'Shippori Mincho', serif";
      ctx.fillText(`発行番号 ${document.getElementById('issueNo').value}`, 55, 535);

      ctx.font = "500 20px 'Shippori Mincho', serif";
           ctx.fillText("西曆 ", 440, 535);
           ctx.fillText("年 認可", 535, 535);

      ctx.fillText(document.getElementById('approveYear').value, 491, 535);
    }

    // 監聽圖片與字型載入
    bgImg.onload = () => renderCard();
    document.fonts.ready.then(() => renderCard());

    // 監聽所有輸入框變動
    document.querySelectorAll('input[type="text"]').forEach(input => {
      input.addEventListener('input', renderCard);
    });
    bgSelector.addEventListener('change', (e) => {
    bgImg.src = e.target.value;
    });

    // 處理大頭照上傳
    document.getElementById('avatarInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          userAvatar = new Image();
          userAvatar.onload = renderCard;
          userAvatar.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // 下載功能
    document.getElementById('downloadBtn').addEventListener('click', () => {
  try {
    const rawName = document.getElementById('name').value.trim();
    const fileName = `審神者許可證_${rawName || '未命名'}.png`;

    // 1. 將畫布轉為 Base64 圖片網址
    const dataUrl = canvas.toDataURL('image/png');

    // 2. 顯示長按儲存區，並把圖片放進去（解救 FB / 噗浪 / LINE 內嵌瀏覽器）
    const exportImg = document.getElementById('exportImg');
    const saveTip = document.getElementById('saveTip');
    exportImg.src = dataUrl;
    saveTip.style.display = 'block';

    // 順便平滑捲動到圖片位置，讓手機使用者一眼看到
    saveTip.scrollIntoView({ behavior: 'smooth' });

    // 3. 嘗試一般的自動下載（電腦瀏覽器或一般 Safari/Chrome 會正常運作）
    canvas.toBlob((blob) => {
      if (blob) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
    }, 'image/png');

  } catch (err) {
    console.error(err);
    alert('產生失敗，請確認圖片是否正常載入');
  }
});
  </script>
</body>
</html>
